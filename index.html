<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Md. Mois Khan | Research Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .chart-container { position: relative; width: 100%; max-width: 800px; margin-left: auto; margin-right: auto; height: 350px; max-height: 400px; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
    <!-- Chosen Palette: Slate & Blue Minimalist (Slate 50 background, Slate 900 text, Blue 600 accents) -->
    <!-- Application Structure Plan: A single-page scrolling architecture designed for academic and professional review. Structure: 1) High-impact Hero identifying the candidate and core focus. 2) Projects section detailing systems architecture and outcomes. 3) Interactive Metrics dashboard proving the quantitative claims of the resume (latency, safety scores). 4) Honors & Academics. This flow mimics a research presentation: Introduction -> Methodology -> Results -> Credentials. -->
    <!-- Visualization & Content Choices: Resume Data -> Inform & Compare -> Bar Chart (Chart.js) -> Toggleable datasets -> Justification: Proves the engineering impact claims (sub-3s latency, 15% safety improvement) visually. Library: Chart.js Canvas. NO SVG/Mermaid. -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-200 selection:text-blue-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Navbar = () => (
            <nav class="fixed top-0 w-full bg-slate-50/90 backdrop-blur-md z-50 border-b border-slate-200">
                <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
                    <span class="text-xl font-bold tracking-tighter">Mois Khan.</span>
                    <div class="hidden md:flex space-x-8 text-sm font-medium text-slate-600">
                        <a href="#about" class="hover:text-blue-600 transition-colors">About</a>
                        <a href="#projects" class="hover:text-blue-600 transition-colors">Projects</a>
                        <a href="#metrics" class="hover:text-blue-600 transition-colors">Impact Metrics</a>
                        <a href="#achievements" class="hover:text-blue-600 transition-colors">Achievements</a>
                    </div>
                    <a href="mailto:moiskhanmd9090@gmail.com" class="px-4 py-2 bg-slate-900 text-white text-sm font-medium rounded-md hover:bg-slate-800 transition-colors">
                        Contact &#x2192;
                    </a>
                </div>
            </nav>
        );

        const Hero = () => (
            <header class="min-h-screen flex items-center justify-center pt-20 px-6">
                <div class="max-w-5xl mx-auto text-center flex flex-col items-center">
                    
                    {/* 1. Reduced bottom margin (mb-4 instead of mb-6) to pull the badge closer to the title */}
                    <span class="inline-block py-1 px-3 rounded-full bg-blue-100 text-blue-800 text-xs font-semibold tracking-wider mb-4 uppercase">
                        IITH SURE 2026 Applicant
                    </span>
                    
                    {/* 2. Adjusted text sizing (md:text-6xl lg:text-7xl) and added a manual line break (<br/>) so it balances perfectly on large screens */}
                    <h1 class="text-5xl md:text-6xl lg:text-7xl font-bold tracking-tight text-slate-900 mb-6 leading-[1.15]">
                        Transforming <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">AI Research</span><br class="hidden md:block" />
                        into Secure, High-Speed Systems.
                    </h1>
                    
                    {/* 3. Widened the max-width (max-w-3xl) of the paragraph so it forms a cleaner, wider block of text */}
                    <p class="text-lg md:text-xl text-center text-slate-600 mb-10 max-w-3xl leading-relaxed">
                        B.Tech student specializing in Cyber Security. My research interests center on developing secure, applied AI solutions—orchestrating complex models and spatial APIs to build resilient, user-centric technologies.
                    </p>
                    
                    <div class="flex flex-col sm:flex-row justify-center items-center space-y-4 sm:space-y-0 sm:space-x-6">
                        <a href="#projects" class="px-8 py-4 bg-slate-900 text-white rounded-lg font-medium hover:bg-slate-800 transition-all shadow-lg hover:shadow-xl w-full sm:w-auto">
                            Explore My Work
                        </a>
                        <a href="https://github.com/mois-khan" target="_blank" class="px-8 py-4 bg-white text-slate-900 border border-slate-200 rounded-lg font-medium hover:border-slate-400 transition-all w-full sm:w-auto">
                            View GitHub &#x2197;
                        </a>
                    </div>
                </div>
            </header>
        );

        const ProjectCard = ({ title, tag, description, points, metrics, link }) => (
            <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                <div class="flex justify-between items-start mb-4">
                    <h3 class="text-2xl font-bold text-slate-900">{title}</h3>
                    <span class="px-3 py-1 bg-slate-100 text-slate-600 text-xs font-medium rounded-full">{tag}</span>
                </div>
                <p class="text-slate-600 mb-6">{description}</p>
                <div class="space-y-3 mb-8">
                    {points.map((pt, i) => (
                        <div key={i} class="flex items-start">
                            <span class="text-blue-600 mr-3 mt-1">&#x2713;</span>
                            <p class="text-sm text-slate-700"><strong>{pt.split(':')[0]}:</strong> {pt.split(':')[1] || pt}</p>
                        </div>
                    ))}
                </div>
                <div class="bg-slate-50 p-4 rounded-lg mb-6 border border-slate-100">
                    <p class="text-sm font-semibold text-slate-900 mb-1">Impact Metric</p>
                    <p class="text-slate-600 text-sm">{metrics}</p>
                </div>
                <a href={link} target="_blank" class="text-blue-600 font-medium hover:text-blue-800 flex items-center text-sm">
                    View Repository <span class="ml-1">&#x2192;</span>
                </a>
            </div>
        );

        const Projects = () => (
            <section id="projects" class="py-24 px-6 bg-slate-50">
                <div class="max-w-6xl mx-auto">
                    <div class="mb-16">
                        <h2 class="text-3xl md:text-4xl font-bold text-slate-900 mb-4">Functional Prototypes</h2>
                        <p class="text-slate-600 max-w-2xl">This section details my core engineering projects, focusing on system architecture, API orchestration, and measurable performance outcomes. These prototypes demonstrate my ability to move beyond theory into functional, low-latency execution.</p>
                    </div>
                    <div class="grid md:grid-cols-2 gap-8">
                        <ProjectCard 
                            title="CallShield-AI"
                            tag="Voice Security"
                            description="A real-time LLM-driven pipeline for social engineering and fraud detection during live telephonic streams."
                            points={[
                                "Architecture: Architected an asynchronous pipeline using Node.js and WebSockets.",
                                "Implementation: Integrated Deepgram (STT) with Gemini 1.5 Flash.",
                                "Evaluation: Benchmarked against synthetic scam taxonomies (KYC, Lottery)."
                            ]}
                            metrics="Sub-3 second end-to-end detection latency with a 90%+ True Positive Rate."
                            link="https://github.com/mois-khan/callshield-ai"
                        />
                        <ProjectCard 
                            title="SafeRoute"
                            tag="Urban Navigation"
                            description="A multi-criteria pathfinding heuristic navigation system prioritizing urban safety over traditional distance metrics."
                            points={[
                                "Concept: Prioritizes Safety Density over standard shortest-path algorithms.",
                                "Methodology: Custom heuristic logic weighing geospatial data points (OSM).",
                                "Signals Used: Police Stations, Hospitals, and Street Lighting density."
                            ]}
                            metrics="Demonstrated a 15% safety score improvement over baseline routing."
                            link="https://github.com/mois-khan/saferoute-AI"
                        />
                    </div>
                </div>
            </section>
        );

        const MetricsChart = () => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);
            const [view, setView] = useState('latency'); 

            useEffect(() => {
                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const ctx = chartRef.current.getContext('2d');
                
                const latencyData = {
                    labels: ['Sequential API Polling', 'CallShield-AI (Async Pipeline)'],
                    datasets: [{
                        label: 'End-to-End Latency (Seconds)',
                        data: [8.5, 2.8],
                        backgroundColor: ['#cbd5e1', '#2563eb'],
                        borderRadius: 6
                    }]
                };

                const safetyData = {
                    labels: ['Standard Routing (Distance)', 'SafeRoute-AI (Heuristic)'],
                    datasets: [{
                        label: 'Relative Safety Score (0-100)',
                        data: [65, 80],
                        backgroundColor: ['#cbd5e1', '#10b981'],
                        borderRadius: 6
                    }]
                };

                const config = {
                    type: 'bar',
                    data: view === 'latency' ? latencyData : safetyData,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: '#0f172a',
                                titleFont: { family: 'Inter', size: 13 },
                                bodyFont: { family: 'Inter', size: 14 },
                                padding: 12,
                                cornerRadius: 8
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                grid: { color: '#f1f5f9' },
                                title: {
                                    display: true,
                                    text: view === 'latency' ? 'Seconds (Lower is Better)' : 'Score (Higher is Better)',
                                    font: { family: 'Inter', weight: '500' }
                                }
                            },
                            x: {
                                grid: { display: false },
                                ticks: { font: { family: 'Inter', weight: '500' } }
                            }
                        }
                    }
                };

                chartInstance.current = new Chart(ctx, config);

                return () => {
                    if (chartInstance.current) chartInstance.current.destroy();
                };
            }, [view]);

            return (
                <section id="metrics" class="py-24 px-6 bg-white border-y border-slate-200">
                    <div class="max-w-4xl mx-auto">
                        <div class="mb-12 text-center">
                            <h2 class="text-3xl md:text-4xl font-bold text-slate-900 mb-4">Quantifying Impact</h2>
                            <p class="text-slate-600 mb-8">This interactive visualization substantiates the performance claims of my architectural decisions. Select a metric below to compare baseline performance against my engineered solutions.</p>
                            
                            <div class="inline-flex bg-slate-100 p-1 rounded-lg">
                                <button 
                                    onClick={() => setView('latency')}
                                    class={`px-6 py-2 rounded-md text-sm font-medium transition-all ${view === 'latency' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-900'}`}
                                >
                                    CallShield Latency
                                </button>
                                <button 
                                    onClick={() => setView('safety')}
                                    class={`px-6 py-2 rounded-md text-sm font-medium transition-all ${view === 'safety' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-900'}`}
                                >
                                    SafeRoute Effectiveness
                                </button>
                            </div>
                        </div>
                        
                        <div class="chart-container bg-slate-50 p-6 rounded-2xl border border-slate-200">
                            <canvas ref={chartRef}></canvas>
                        </div>
                        <p class="text-center text-xs text-slate-400 mt-4 font-mono uppercase tracking-wider">Fig 1: {view === 'latency' ? 'Latency Reduction via Async Pipeline' : 'Heuristic Optimization of Route Safety'}</p>
                    </div>
                </section>
            );
        };

        const Achievements = () => (
            <section id="achievements" class="py-24 px-6 bg-slate-900 text-white">
                <div class="max-w-6xl mx-auto">
                    <div class="grid md:grid-cols-2 gap-16">
                        <div>
                            <h2 class="text-3xl font-bold mb-8">Academic Standing</h2>
                            <div class="space-y-6">
                                <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                                    <div class="text-4xl font-light text-blue-400 mb-2">8.50</div>
                                    <div class="font-semibold text-lg">SGPA (Semester III-I)</div>
                                    <div class="text-slate-400 text-sm mt-1">Malla Reddy Engineering College & Management Sciences</div>
                                </div>
                                <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 flex items-center">
                                    <div class="text-3xl mr-4">&#x1F3C6;</div>
                                    <div>
                                        <div class="font-semibold text-lg">Top 20% Certification</div>
                                        <div class="text-slate-400 text-sm">CSE Department</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div>
                            <h2 class="text-3xl font-bold mb-8">Honors & Competitions</h2>
                            <ul class="space-y-6">
                                <li class="flex items-start">
                                    <span class="text-blue-400 mr-4 text-xl">&#x2728;</span>
                                    <div>
                                        <h4 class="text-xl font-semibold">1st Prize - Paper Presentation</h4>
                                        <p class="text-slate-400 text-sm mt-1">Avazya 2k25 at CMREC. Awarded for excellence in technical research synthesis and presentation logic.</p>
                                    </div>
                                </li>
                                <li class="flex items-start">
                                    <span class="text-blue-400 mr-4 text-xl">&#x1F680;</span>
                                    <div>
                                        <h4 class="text-xl font-semibold">OpenAI x NXT Buildathon</h4>
                                        <p class="text-slate-400 text-sm mt-1">2025 Participant. Developed a generative AI prototype under strict time constraints, focusing on ethical AI integration.</p>
                                    </div>
                                </li>
                                <li class="flex items-start">
                                    <span class="text-blue-400 mr-4 text-xl">&#x1F4BB;</span>
                                    <div>
                                        <h4 class="text-xl font-semibold">Technical Stack</h4>
                                        <p class="text-slate-400 text-sm mt-1">Python, JavaScript (ES6+), Node.js, Express, WebSocket, Gemini 1.5 API, Deepgram STT, Tailwind CSS, React.</p>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer class="py-8 text-center text-slate-500 text-sm bg-slate-950">
                <p>&copy; 2026 Md. Mois Khan. Structured for research review.</p>
            </footer>
        );

        const App = () => {
            return (
                <div class="relative">
                    <Navbar />
                    <main>
                        <Hero />
                        <Projects />
                        <MetricsChart />
                        <Achievements />
                    </main>
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
